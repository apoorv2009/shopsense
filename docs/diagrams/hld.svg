<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 900" width="1380" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>ShopSense high-level architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t{font-size:14px;font-weight:600;text-anchor:middle}
      .s{font-size:12px;text-anchor:middle}
      .g{font-size:13px;font-weight:600}
      .arr{fill:none;stroke:#444441;stroke-width:1.5}
      .dash{fill:none;stroke:#888780;stroke-width:1.3;stroke-dasharray:5 4}
      .grp{fill:none;stroke:#888780;stroke-width:1.2;stroke-dasharray:6 4}
      .client rect{fill:#EEEDFE;stroke:#534AB7}
      .client text{fill:#3C3489}
      .edge rect{fill:#E6F1FB;stroke:#185FA5}
      .edge text{fill:#0C447C}
      .svc rect{fill:#E1F5EE;stroke:#0F6E56}
      .svc text{fill:#085041}
      .mod rect{fill:#FFFFFF;stroke:#5DCAA5}
      .mod text{fill:#085041;font-size:12px;text-anchor:middle}
      .data rect{fill:#FAEEDA;stroke:#854F0B}
      .data text{fill:#633806}
      .ai rect{fill:#FBEAF0;stroke:#993556}
      .ai text{fill:#72243E}
      .obs rect{fill:#F1EFE8;stroke:#5F5E5A}
      .obs text{fill:#444441}
    </style>
  </defs>
  <rect width="1380" height="900" fill="#FFFFFF"/>

  <!-- Clients -->
  <rect class="grp" x="50" y="34" width="500" height="112" rx="8"/>
  <text class="g" x="62" y="52" fill="#3C3489">Angular SPA · Azure Static Web Apps</text>
  <g class="client"><rect x="70" y="62" width="220" height="68" rx="6" stroke-width="1.2"/>
    <text class="t" x="180" y="91">Customer portal</text><text class="s" x="180" y="112">chat · my orders · tickets</text></g>
  <g class="client"><rect x="310" y="62" width="220" height="68" rx="6" stroke-width="1.2"/>
    <text class="t" x="420" y="91">Reviewer console</text><text class="s" x="420" y="112">approvals · case timeline</text></g>
  <g class="client"><rect x="590" y="62" width="180" height="68" rx="6" stroke-width="1.2"/>
    <text class="t" x="680" y="91">Support mailbox</text><text class="s" x="680" y="112">customer email</text></g>
  <g class="client"><rect x="800" y="62" width="220" height="68" rx="6" stroke-width="1.2"/>
    <text class="t" x="910" y="91">Logic Apps</text><text class="s" x="910" y="112">email in · replies out</text></g>
  <line class="arr" x1="770" y1="96" x2="798" y2="96" marker-end="url(#a)"/>

  <!-- Identity -->
  <g class="obs"><rect x="1100" y="62" width="240" height="68" rx="6" stroke-width="1.2"/>
    <text class="t" x="1220" y="91">Entra ID</text><text class="s" x="1220" y="112">users · roles · managed identities</text></g>

  <!-- APIM -->
  <rect class="grp" x="50" y="180" width="970" height="112" rx="8"/>
  <text class="g" x="62" y="198" fill="#0C447C">Azure API Management</text>
  <g class="edge"><rect x="80" y="208" width="420" height="68" rx="6" stroke-width="1.2"/>
    <text class="t" x="290" y="237">API gateway</text><text class="s" x="290" y="258">Entra JWT + roles · per-customer rate limits · routing</text></g>
  <g class="edge"><rect x="560" y="208" width="430" height="68" rx="6" stroke-width="1.2"/>
    <text class="t" x="775" y="237">AI gateway</text><text class="s" x="775" y="258">token limits · failover · usage metrics</text></g>

  <!-- Azure AI -->
  <g class="ai"><rect x="1100" y="200" width="240" height="68" rx="6" stroke-width="1.2"/>
    <text class="t" x="1220" y="229">Azure AI Foundry</text><text class="s" x="1220" y="250">Claude · groundedness evaluators</text></g>
  <g class="ai"><rect x="1100" y="296" width="240" height="68" rx="6" stroke-width="1.2"/>
    <text class="t" x="1220" y="325">Azure AI Content Safety</text><text class="s" x="1220" y="346">Prompt Shields</text></g>

  <!-- Container Apps environment -->
  <rect class="grp" x="50" y="340" width="970" height="370" rx="8"/>
  <text class="g" x="62" y="358" fill="#085041">Azure Container Apps environment</text>

  <g class="svc"><rect x="80" y="370" width="560" height="320" rx="8" stroke-width="1.4"/>
    <text class="t" x="360" y="394">ShopSense API (FastAPI)</text></g>
  <g class="mod">
    <rect x="95" y="410" width="165" height="46" rx="5"/><text x="177" y="437">Channel endpoints</text>
    <rect x="275" y="410" width="165" height="46" rx="5"/><text x="357" y="437">LangGraph workflow</text>
    <rect x="455" y="410" width="165" height="46" rx="5"/><text x="537" y="437">LLM gateway module</text>
    <rect x="95" y="476" width="165" height="46" rx="5"/><text x="177" y="503">Triage agent</text>
    <rect x="275" y="476" width="165" height="46" rx="5"/><text x="357" y="503">Policy RAG agent</text>
    <rect x="455" y="476" width="165" height="46" rx="5"/><text x="537" y="503">Order-Actions agent</text>
    <rect x="95" y="542" width="165" height="46" rx="5"/><text x="177" y="569">Escalation Reviewer</text>
    <rect x="275" y="542" width="165" height="46" rx="5"/><text x="357" y="569">Rules engine · risk gate</text>
    <rect x="455" y="542" width="165" height="46" rx="5"/><text x="537" y="569">Input / output guards</text>
    <rect x="95" y="608" width="165" height="46" rx="5"/><text x="177" y="635">Memory · audit log</text>
    <rect x="275" y="608" width="165" height="46" rx="5"/><text x="357" y="635">Approval grants</text>
    <rect x="455" y="608" width="165" height="46" rx="5"/><text x="537" y="635">Outbox worker</text>
  </g>

  <g class="svc"><rect x="690" y="372" width="300" height="64" rx="6" stroke-width="1.2"/>
    <text class="t" x="840" y="398">Qdrant</text><text class="s" x="840" y="418">policy vectors (dense + sparse)</text></g>
  <g class="svc"><rect x="690" y="458" width="300" height="64" rx="6" stroke-width="1.2"/>
    <text class="t" x="840" y="484">MCP server</text><text class="s" x="840" y="504">order tools · circuit breaker</text></g>
  <g class="svc"><rect x="690" y="574" width="300" height="80" rx="6" stroke-width="1.2"/>
    <text class="t" x="840" y="604">Order Platform API (mock)</text><text class="s" x="840" y="626">financial invariants · fault injection</text></g>

  <!-- Data -->
  <rect class="grp" x="50" y="744" width="970" height="124" rx="8"/>
  <text class="g" x="62" y="762" fill="#633806">Data &amp; secrets</text>
  <text x="578" y="762" font-size="12" fill="#633806">one PostgreSQL server, 2 DBs</text>
  <g class="data"><rect x="80" y="776" width="200" height="68" rx="6" stroke-width="1.2"/>
    <text class="t" x="180" y="805">shopsense DB</text><text class="s" x="180" y="826">memory · checkpoints · audit</text></g>
  <g class="data"><rect x="300" y="776" width="150" height="68" rx="6" stroke-width="1.2"/>
    <text class="t" x="375" y="805">Key Vault</text><text class="s" x="375" y="826">secrets · grant key</text></g>
  <g class="data"><rect x="470" y="776" width="170" height="68" rx="6" stroke-width="1.2"/>
    <text class="t" x="555" y="805">Storage queue</text><text class="s" x="555" y="826">post-approval replies</text></g>
  <g class="data"><rect x="690" y="776" width="190" height="68" rx="6" stroke-width="1.2"/>
    <text class="t" x="785" y="805">order_platform DB</text><text class="s" x="785" y="826">orders · refunds</text></g>
  <g class="data"><rect x="896" y="776" width="114" height="68" rx="6" stroke-width="1.2"/>
    <text class="t" x="953" y="805">Azure Files</text><text class="s" x="953" y="826">Qdrant data</text></g>

  <!-- Observability -->
  <g class="obs"><rect x="1100" y="500" width="240" height="68" rx="6" stroke-width="1.2"/>
    <text class="t" x="1220" y="529">Langfuse</text><text class="s" x="1220" y="550">AI traces · eval runs</text></g>
  <g class="obs"><rect x="1100" y="600" width="240" height="68" rx="6" stroke-width="1.2"/>
    <text class="t" x="1220" y="629">Application Insights</text><text class="s" x="1220" y="650">system telemetry · alerts</text></g>

  <!-- Request arrows -->
  <line class="arr" x1="290" y1="146" x2="290" y2="206" marker-end="url(#a)"/>
  <path class="arr" d="M880 130 V160 H470 V206" marker-end="url(#a)"/>
  <line class="arr" x1="290" y1="276" x2="290" y2="368" marker-end="url(#a)"/>
  <path class="arr" d="M600 370 V318 H700 V278" marker-end="url(#a)"/>
  <line class="arr" x1="990" y1="236" x2="1098" y2="236" marker-end="url(#a)"/>
  <path class="arr" d="M625 370 V328 H1098" marker-end="url(#a)"/>
  <line class="arr" x1="640" y1="404" x2="688" y2="404" marker-end="url(#a)"/>
  <line class="arr" x1="640" y1="490" x2="688" y2="490" marker-end="url(#a)"/>
  <line class="arr" x1="840" y1="522" x2="840" y2="572" marker-end="url(#a)"/>
  <line class="arr" x1="785" y1="654" x2="785" y2="774" marker-end="url(#a)"/>
  <line class="arr" x1="180" y1="690" x2="180" y2="774" marker-end="url(#a)"/>
  <line class="arr" x1="555" y1="690" x2="555" y2="774" marker-end="url(#a)"/>
  <path class="arr" d="M990 404 H1006 V774" marker-end="url(#a)"/>

  <!-- Identity / telemetry (dashed) -->
  <path class="dash" d="M1020 186 L1098 128" marker-end="url(#a)"/>
  <line class="dash" x1="1020" y1="534" x2="1098" y2="534" marker-end="url(#a)"/>
  <line class="dash" x1="1020" y1="634" x2="1098" y2="634" marker-end="url(#a)"/>

  <!-- Legend -->
  <g font-size="12" fill="#444441">
    <text x="1100" y="760" font-weight="600" font-size="13">Legend</text>
    <line class="arr" x1="1100" y1="782" x2="1140" y2="782" marker-end="url(#a)"/><text x="1150" y="786">request / data flow</text>
    <line class="dash" x1="1100" y1="806" x2="1140" y2="806" marker-end="url(#a)"/><text x="1150" y="810">identity / telemetry</text>
    <rect x="1100" y="824" width="14" height="14" fill="#E1F5EE" stroke="#0F6E56"/><text x="1122" y="836">our services</text>
    <rect x="1220" y="824" width="14" height="14" fill="#E6F1FB" stroke="#185FA5"/><text x="1242" y="836">gateways</text>
    <rect x="1100" y="848" width="14" height="14" fill="#FBEAF0" stroke="#993556"/><text x="1122" y="860">Azure AI</text>
    <rect x="1220" y="848" width="14" height="14" fill="#FAEEDA" stroke="#854F0B"/><text x="1242" y="860">data</text>
  </g>
</svg>
