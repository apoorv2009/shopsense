[project]
name = "order-platform"
version = "0.1.0"
description = "ShopSense Order Platform (mock order system): orders, shipments, refunds, replacements"
requires-python = ">=3.13,<3.14"
dependencies = [
    "shopsense-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "faker>=30.0",
    "azure-identity>=1.19",
    "aiohttp>=3.10",
]

[project.scripts]
order-platform-seed = "order_platform.entrypoints.seed:main"

[tool.uv.sources]
shopsense-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/order_platform"]
