[project]
name = "shopsense-api"
version = "0.1.0"
description = "ShopSense API: orchestrator, agents and guardrails"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=1.11",
    "openai>=1.60",
    "azure-identity>=1.19",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "aiohttp>=3.10",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "langgraph>=0.2",
    "shopsense-contracts",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
    "mcp>=1.10,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
shopsense-ingest = "shopsense_api.entrypoints.cli:main"
shopsense-workflow = "shopsense_api.entrypoints.workflow_cli:main"
shopsense-outbox = "shopsense_api.entrypoints.outbox_cli:main"

[tool.uv.sources]
shopsense-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopsense_api"]
