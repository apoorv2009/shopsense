[project]
name = "mcp-server"
version = "0.1.0"
description = "ShopSense MCP server: read and system tool endpoints over the Order Platform (LLD-4)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp>=1.10,<2",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "shopsense-contracts",
    "uvicorn>=0.32",
]

[tool.uv.sources]
shopsense-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
