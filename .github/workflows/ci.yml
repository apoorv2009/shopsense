name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install workspace
        run: uv sync --all-packages --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy services/shopsense_api evals
      - name: Tests
        run: uv run pytest --cov=shopsense_api --cov=shopsense_evals --cov-report=term-missing
