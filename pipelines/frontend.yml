# Frontend pipeline. Runs only when the Angular app changes; deploys to the Static Web App.
trigger:
  branches:
    include: [main]
  paths:
    include:
      - frontend/**
pr: none

variables:
  azureServiceConnection: shopsense-azure
  resourceGroup: rg-shopsense-dev-eus2
  staticWebApp: swa-shopsense-dev

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: Build frontend
    jobs:
      - job: Bundle
        steps:
          - checkout: self
          - task: NodeTool@0
            displayName: Node 24
            inputs:
              versionSpec: '24.x'
          - script: |
              set -euo pipefail
              cd frontend
              npm ci
              npx ng build --configuration production
            displayName: Build Angular production bundle
          - publish: frontend/dist/shopsense-ui/browser
            artifact: frontend-bundle

  - stage: Deploy
    displayName: Deploy to Static Web App
    dependsOn: Build
    jobs:
      - job: Upload
        steps:
          - download: current
            artifact: frontend-bundle
          - task: AzureCLI@2
            displayName: Upload bundle
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                token=$(az staticwebapp secrets list -g "$(resourceGroup)" -n "$(staticWebApp)" --query properties.apiKey -o tsv)
                npx -y @azure/static-web-apps-cli deploy "$(Pipeline.Workspace)/frontend-bundle" --deployment-token "$token" --env production
